name: Deploy to Cloudflare Workers
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: personal-site-deployment
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install taiki-e
        uses: taiki-e/install-action@v2
        with:
          tool: zola

      - name: Build Rust (Zola) Site
        run: |
          cd rust
          zola build --output-dir ../dist/rust

      # Later: Blazor (publish puts the site in wwwroot, so copy that, not the whole folder)
      # - name: Build .NET (Blazor) Site
      #   run: |
      #     dotnet publish dotnet -c Release -o build/dotnet
      #     cp -r build/dotnet/wwwroot dist/dotnet

      - name: Shared Assets and Redirect
        run: |
          cp -r shared dist/shared
          echo "/ /rust/ 302" > dist/_redirects

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
